plugins {
    id "com.android.application"
}

android {
    namespace "community.krynet.ports"
    compileSdk 35

    defaultConfig {
        applicationId "community.krynet.ports"
        minSdk 24
        targetSdk 35

        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.31.6"
        }
    }

    buildFeatures {
        buildConfig true
    }
}
